name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/java/com/loanemimanager
          mkdir -p app/src/main/res/values

          cp "AndroidManifest.xml" app/src/main/AndroidManifest.xml
          cp "MainActivity.kt" app/src/main/java/com/loanemimanager/MainActivity.kt
          cp "strings.xml" app/src/main/res/values/strings.xml
          cp "styles.xml" app/src/main/res/values/styles.xml
          cp "build.gradle (1).kts" app/build.gradle.kts

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LoanEMIManager
          path: app/build/outputs/apk/debug/app-debug.apk
